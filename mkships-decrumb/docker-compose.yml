version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: mkships-decrumb_web_1
      APP_PORT: 8080

  web:
    image: ghcr.io/moey823/decrumb:umbrel-27c41e493a462d9d201be15b5e688b8fbe83b821@sha256:d116eb7708246447df10cd945912744f40aa821ffbbdf17c56f02394b7289193
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 40s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    environment:
      DECRUMB_PASSWORD: ${APP_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/state:/data
      # Native Signal libraries need writable, executable temporary space.
      # Keep large AMD64 libraries on disk rather than in a RAM-backed tmpfs.
      - ${APP_DATA_DIR}/data/tmp:/tmp
