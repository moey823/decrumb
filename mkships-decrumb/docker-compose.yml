version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: mkships-decrumb_web_1
      APP_PORT: 8080

  web:
    image: ghcr.io/moey823/decrumb:umbrel-318ac635900377a9f1a2e79c6db622cddb3639c1@sha256:ebc0162421a5ee7d153211159e326e9088406e0b517ff55f52a1fde39cd94f72
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 40s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    environment:
      DECRUMB_PASSWORD: ${APP_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/state:/data
      # Native Signal libraries need writable, executable temporary space.
      # Keep large AMD64 libraries on disk rather than in a RAM-backed tmpfs.
      - ${APP_DATA_DIR}/data/tmp:/tmp
