version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: mkships-decrumb_web_1
      APP_PORT: 8080

  web:
    image: ghcr.io/moey823/decrumb:umbrel-7ef5e4ae6b50b6839e18a4d08ba622f63857e81a@sha256:e0bad5861cb0c57c54dcbe0f3210971329d4235ded08a6ab7f62e93be16bf3c9
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 40s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    environment:
      DECRUMB_PASSWORD: ${APP_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/state:/data
      # Native Signal libraries need writable, executable temporary space.
      # Keep large AMD64 libraries on disk rather than in a RAM-backed tmpfs.
      - ${APP_DATA_DIR}/data/tmp:/tmp
