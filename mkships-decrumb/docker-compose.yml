version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: mkships-decrumb_web_1
      APP_PORT: 8080

  web:
    image: ghcr.io/moey823/decrumb:umbrel-dcd4195c379fd0585f82b54f06db8d6e8c000385@sha256:f49c757583e2f279af1680f34aca719b1d02c6a6822b60caab1e56962f6e728f
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 40s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    environment:
      DECRUMB_PASSWORD: ${APP_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/state:/data
      # Native Signal libraries need writable, executable temporary space.
      # Keep large AMD64 libraries on disk rather than in a RAM-backed tmpfs.
      - ${APP_DATA_DIR}/data/tmp:/tmp
