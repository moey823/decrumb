name: Umbrel container

on:
  pull_request:
    paths: ['web/**', 'container/**', '*_server.py', 'container_dependency.py', 'decrumb.py', 'notes.py', 'phone_commands.py', 'portable_cleaner.py', 'rules/**', 'tools/smoke_web.py', '.github/workflows/container.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build native container
        run: docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" -f container/Dockerfile -t decrumb-test .
      - name: Test installed native dependency and browser lifecycle
        run: |
          mkdir -p "$RUNNER_TEMP/decrumb-state" "$RUNNER_TEMP/decrumb-native-temp"
          sudo chown 1000:1000 "$RUNNER_TEMP/decrumb-state" "$RUNNER_TEMP/decrumb-native-temp"
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            -v "$RUNNER_TEMP/decrumb-state:/data" \
            -v "$RUNNER_TEMP/decrumb-native-temp:/tmp" \
            -v "$PWD/tools/smoke_web.py:/test/smoke_web.py:ro" \
            --entrypoint python3 decrumb-test /test/smoke_web.py
      - name: Log in to container registry
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested architecture
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          image="ghcr.io/moey823/decrumb:umbrel-$GITHUB_SHA-$ARCH"
          docker tag decrumb-test "$image"
          docker push "$image"

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish both architectures as one pinned image
        run: |
          image="ghcr.io/moey823/decrumb:umbrel-$GITHUB_SHA"
          docker buildx imagetools create --tag "$image" "$image-amd64" "$image-arm64"
          docker buildx imagetools inspect "$image"
