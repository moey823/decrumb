name: Windows CLI

on:
  push:
    branches: [main, 'codex/windows-cli']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install pinned build dependencies
        run: python -m pip install -r tools/requirements-build.txt -r windows/requirements.txt
      - name: Build experimental Windows bundle
        run: python -B build.py --windows
      - name: Native offline and shared behavior tests
        run: python -B tools/run_windows_tests.py
      - name: Verify packaged executables and isolated Signal runtime
        run: python -B tools/smoke_windows.py --bundle build/windows/Decrumb
      - name: Upload experimental build for testing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: decrumb-windows-x64-experimental
          path: |
            build/windows/Decrumb-*-windows-x64.zip
            build/windows/Decrumb-*-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
